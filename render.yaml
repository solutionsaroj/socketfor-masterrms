services:
  - type: web
    name: socketio-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"
      - key: SOCKET_AUTH_TOKEN
        value: "rms_secret_token_9f82d1"
